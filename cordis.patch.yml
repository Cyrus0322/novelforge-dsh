- insert:
    - id: novelforge
      name: novelforge-dsh
      config:
        databasePath: ./data/novelforge.db
        apiKeyEnv: DEEPSEEK_API_KEY
        baseURL: https://api.deepseek.com
        # provider / model 留空 = 跟随 DSH 宿主默认模型（推荐）；填值则覆盖宿主选择
        provider: ""
        model: ""
        temperature: 0.8
        maxTokens: 4096
        timeoutMs: 60000
        maxRetries: 3
        retryBaseDelayMs: 800
        maxInputTokens: 24000
        maxContextTokens: 64000
        recentChapters: 3
        maxRevisionRounds: 3
        # 本地工作台：插件加载时自动启动 REST 服务，供 DSH 内嵌面板与浏览器界面使用
        studioAutoStart: true
        studioPort: 4319
