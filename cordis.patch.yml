- insert:
    - id: novelforge
      name: novelforge-dsh
      config:
        databasePath: ./data/novelforge.db
        apiKeyEnv: DEEPSEEK_API_KEY
        baseURL: https://api.deepseek.com
        # provider / model 留空 = 跟随 DSH 宿主默认模型（推荐）；填值则覆盖宿主选择
        provider: ""
        model: ""
        temperature: 0.8
        maxTokens: 4096
        timeoutMs: 60000
        maxRetries: 3
        retryBaseDelayMs: 800
        maxInputTokens: 24000
        maxContextTokens: 64000
        recentChapters: 3
        maxRevisionRounds: 3
        # 面板默认走 DSH 宿主同源路由（/novelforge-api），不需要额外进程；
        # 想单独在浏览器用完整工作台时，改 true 再由插件起独立服务（或直接跑 npx novelforge-dsh studio）
        studioAutoStart: false
        studioPort: 4319
